apiVersion: v1
kind: Service
metadata:
    name: clickhouse-service
spec:
    selector:
      app: clickhouse
    ports:
    - name: http
      protocol: TCP
      port: 8123  # cluster assigned ip port
      targetPort: 8123 # pod container ip port
    - name: native
      protocol: TCP
      port: 9000 # cluster assigned ip port
      targetPort: 9000 # pod container ip port