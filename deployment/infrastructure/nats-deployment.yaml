apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats-deployment
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: docker.io/library/nats:alpine
          imagePullPolicy: IfNotPresent
          args:
            - '-js'        
            - '-sd'        
            - /var/lib/nats/data
            - --user
            - nats_user
            - --pass
            - nats_pass
          ports:
            - containerPort: 4222
              name: client
          volumeMounts:
            - name: nats-storage
              mountPath: /var/lib/nats/data
  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nats-sc
        resources:
          requests:
            storage: 2Gi
