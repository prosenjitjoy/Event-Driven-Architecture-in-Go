apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-secret
  labels:
    app: payments
data:
  ENVIRONMENT: "production"
  WEB_PORT: "8080"
  RPC_PORT: "9000"
  RPC_SERVICES: "STORES=stores-service:9000,CUSTOMERS=customers-service:9000"
  PG_CONN: "postgres://paymentsdb_user:paymentsdb_pass@postgres-service:5432/paymentsdb?sslmode=disable"
  NATS_URL: "nats://nats_user:nats_pass@nats-service:4222"
  OTEL_SERVICE_NAME: "payments"
  CH_HOST: "clickhouse-service"
  CH_PORT: "9000"
  CH_DB: "oteldb"
  CH_USER: "oteldb_user"
  CH_PASS: "oteldb_pass"

